name: .NET CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          runtime: win-x64
        - os: ubuntu-latest
          runtime: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install the message bus for the Linux tests
      if: runner.os == 'Linux'
      run: |
        if [ ! -x /usr/bin/dbus-daemon ]; then
          sudo apt-get update
          sudo apt-get install -y dbus
        fi

    - name: Restore dependencies
      run: dotnet restore Echo.sln

    - name: Build project
      run: dotnet build Echo.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test Echo.sln --no-build --configuration Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults

    - name: Keep test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tests-${{ matrix.runtime }}
        path: TestResults/*.trx
        if-no-files-found: warn
        retention-days: 7

    - name: Verify the self-contained release build
      run: dotnet publish Echo/Echo.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained --output out

    - name: Verify the published executable
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          out/echooo.exe --version
        else
          out/echooo --version
        fi
